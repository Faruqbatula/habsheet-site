<!--
  A REDIRECT, AND IT STAYS ONE. 5 October 2026: the pricing page came off
  habsheet.com, because prices are not settled and a visitor reading a number
  nobody is ready to stand behind is worse than reading none. The engineer's
  instruction was to keep this file rather than delete it — the page was linked
  from the site for three weeks, so the link exists in people's history, in mail
  and possibly in a search index, and a 404 is a worse answer than the thing
  that replaced it.

  GitHub Pages serves no redirects of its own, so this is the only kind
  available: a meta refresh, with the canonical pointing at where the content
  went and a real link for anyone the refresh does not carry. There is no
  stylesheet and no header on purpose. Nobody is meant to read this page.

  It states NO PRICE, and check-price-parity requires that of every page that
  does not sell — so putting a figure back here fails the suite rather than
  quietly reinstating a price list.
-->
<meta http-equiv="refresh" content="0; url=contact.html">
<link rel="canonical" href="https://habsheet.com/contact.html">
<meta name="robots" content="noindex">
</head>
<body>
<p>Habsheet pricing is not published yet. <a href="contact.html">Get in touch</a> and we will tell you what it costs.</p>
</body>
